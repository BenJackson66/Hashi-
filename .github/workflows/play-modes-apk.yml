name: Play modes Android APK

on:
  push:
    branches: [feature/h04-play-modes]
permissions:
  contents: read
  actions: read

concurrency:
  group: play-modes-apk-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Godot 4.6.3 · ARM64 debug
    # Exactly one grouped candidate after source review; ordinary pushes only test.
    if: contains(github.event.head_commit.message, '[apk]')
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout selected branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Require persistent signing credentials
        env:
          HASHI_SIGNING_KEYSTORE_BASE64: ${{ secrets.HASHI_SIGNING_KEYSTORE_BASE64 }}
          HASHI_SIGNING_PASSWORD: ${{ secrets.HASHI_SIGNING_PASSWORD }}
        run: |
          ./tools/ci/check-signing-secrets.sh
          python3 tests/signing_security.py
      - name: Set up JDK 17
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android export tools
        run: |
          export ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          export ANDROID_SDK_ROOT="$ANDROID_HOME"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'platform-tools' 'platforms;android-36' 'build-tools;36.1.0'
      - name: Install verified Godot and Android debug template
        run: |
          ./tools/ci/install-godot.sh
          echo "$PWD/.local/android-ci/bin" >> "$GITHUB_PATH"
      - name: Test, export and statically verify APK
        env:
          HASHI_SIGNING_KEYSTORE_BASE64: ${{ secrets.HASHI_SIGNING_KEYSTORE_BASE64 }}
          HASHI_SIGNING_PASSWORD: ${{ secrets.HASHI_SIGNING_PASSWORD }}
        run: ./tools/ci/export-android.sh
      - name: Compare identity with approved H02-C APK when retained
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          previous="$RUNNER_TEMP/hashi-previous"
          mkdir -p "$previous"
          if gh run download 40225429852 --pattern 'hashi-h01-debug-arm64-7' --dir "$previous" > "$RUNNER_TEMP/hashi-download.log" 2>&1; then
            previous_apk="$(python3 -c 'import pathlib,sys; files=list(pathlib.Path(sys.argv[1]).rglob("hashi-h01-debug-arm64.apk")); assert len(files)==1, "Expected exactly one historical APK"; print(files[0])' "$previous")"
            python3 tools/ci/apk-signing.py --apksigner "$ANDROID_HOME/build-tools/36.1.0/apksigner" compare "$previous_apk" build/android/hashi-h01-debug-arm64.apk
            echo 'VERIFIED: same signing certificate as approved H02-C run 40225429852.' > build/android/historical-identity.txt
          else
            echo 'UNAVAILABLE: previous artifact not downloadable; current APK certificate verified against the persistent signing keystore.' > build/android/historical-identity.txt
            echo '::warning::Historical certificate comparison unavailable; see historical-identity.txt.'
          fi
      - name: Upload debug APK and verification
        id: apk
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: hashi-play-modes-debug-arm64-${{ github.run_number }}
          path: |
            build/android/hashi-h01-debug-arm64.apk
            build/android/SHA256SUMS.txt
            build/android/apk-verification.txt
            build/android/signing-certificate-sha256.txt
            build/android/historical-identity.txt
          if-no-files-found: error
          retention-days: 14
      - name: Report result
        run: |
          {
            echo '### Hashi Android debug APK'
            echo "Commit: $GITHUB_SHA"
            echo 'APK: hashi-h01-debug-arm64.apk (ARM64, Android 7.0/API 24+)'
            echo 'Version: 0.3.0 / versionCode 3; package org.hashi.prototype'
            echo 'Signature, alignment, manifest and packaged data checked.'
            echo 'Public signing certificate SHA-256:'
            cat build/android/signing-certificate-sha256.txt
            cat build/android/SHA256SUMS.txt
            cat build/android/historical-identity.txt
            echo 'No device installation or gameplay test was performed by this workflow.'
          } >> "$GITHUB_STEP_SUMMARY"
