name: Android Debug APK

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-debug-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Godot 4.6.3 · ARM64 debug
    # Allow builds from main and the prototype branch.
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/feature/h01-prototipo'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout selected branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Set up JDK 17
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
      - name: Install Android export tools
        run: sdkmanager 'platform-tools' 'platforms;android-36' 'build-tools;36.1.0'
      - name: Install verified Godot and Android debug template
        run: |
          ./tools/ci/install-godot.sh
          echo "$PWD/.local/android-ci/bin" >> "$GITHUB_PATH"
      - name: Test, export and statically verify APK
        run: ./tools/ci/export-android.sh
      - name: Upload debug APK and verification
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: hashi-h01-debug-arm64-${{ github.run_number }}
          path: |
            build/android/hashi-h01-debug-arm64.apk
            build/android/SHA256SUMS.txt
            build/android/apk-verification.txt
          if-no-files-found: error
          retention-days: 14
      - name: Report result
        run: |
          {
            echo '### Hashi Android debug APK'
            echo "Commit: $GITHUB_SHA"
            echo 'APK: hashi-h01-debug-arm64.apk (ARM64, Android 7.0/API 24+)'
            echo 'Signature, alignment, manifest and packaged data checked.'
            echo 'No device installation or gameplay test was performed by this workflow.'
          } >> "$GITHUB_STEP_SUMMARY"
